name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  SERVICE_NAME: smart-health-system-ai
  IMAGE_NAME: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smart-health-system-ai/smart-health-system-ai
  SERVICE_NAME_UI: smart-health-ui
  IMAGE_NAME_UI: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smart-health-system-ai/smart-health-ui

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Cache pip dependencies 
        uses: actions/cache@v3 
        with: 
          path: ~/.cache/pip 
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }} 
          restore-keys: | 
            ${{ runner.os }}-pip-

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          uv sync
          uv pip install pytest pytest-cov pytest-asyncio

      - name: Run linting 
        run: | 
          uv run ruff check . || true 
          uv run black --check . || true

      - name: Run tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          uv run pytest tests/ -v --cov=. --cov-report=xml --cov-report=term || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Verify Variables
        run: |
          echo "PROJECT_ID=${{ env.PROJECT_ID }}"
          echo "IMAGE_NAME=${{ env.IMAGE_NAME }}"

  build-and-deploy:
    name: Build and Deploy to Cloud Run (API + UI)
    runs-on: ubuntu-latest
    needs: test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build API Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

      - name: Build UI Docker image
        run: |
          docker build -f ui/Dockerfile -t ${{ env.IMAGE_NAME_UI }}:${{ github.sha }} ui/
          docker tag ${{ env.IMAGE_NAME_UI }}:${{ github.sha }} ${{ env.IMAGE_NAME_UI }}:latest

      - name: Push Docker images to Artifact Registry
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME_UI }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME_UI }}:latest

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 10 \
            --service-account ${{ vars.SERVICE_ACCOUNT }} \
            --port 8000 \
            --min-instances 0 \
            --set-env-vars "LOG_LEVEL=INFO" \
            --set-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest"

      - name: Get API service URL
        id: service
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Run API health check
        run: |
          sleep 15
          curl -f "${{ steps.service.outputs.service_url }}/api/v1/health"

      - name: Deploy UI to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME_UI }} \
            --image ${{ env.IMAGE_NAME_UI }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --service-account ${{ vars.SERVICE_ACCOUNT }} \
            --port 8080 \
            --set-env-vars "API_BASE_URL=${{ steps.service.outputs.service_url }}/api/v1"

      - name: Get UI service URL
        id: ui_service
        run: |
          UI_URL=$(gcloud run services describe ${{ env.SERVICE_NAME_UI }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          echo "ui_url=$UI_URL" >> $GITHUB_OUTPUT

      - name: Update API CORS to include UI URL
        run: |
          echo "Updating API CORS_ORIGINS to include UI URL"
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --update-env-vars "CORS_ORIGINS=${{ steps.ui_service.outputs.ui_url }}"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()

    steps:
      - name: Deployment Success
        if: needs.build-and-deploy.result == 'success'
        run: |
          echo "Deployment successful!"
          echo "HealthLink API: ${{ steps.build-and-deploy.outputs.service_url }}"
          echo "HealthLink UI: ${{ steps.build-and-deploy.outputs.ui_url }}"

      - name: Deployment Failed
        if: needs.build-and-deploy.result == 'failure'
        run: |
          echo "Deployment failed!"
          echo "Please check the logs above for errors"
          exit 1
